name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute commit provenance annotations
        id: provenance
        uses: layro01-org/annotate-container-image@v1

      - name: Extract image tags
        id: tags
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          TAGS="$ECR_REGISTRY/stockroom-api:${{ github.sha }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS
            $ECR_REGISTRY/stockroom-api:${{ github.ref_name }}
            $ECR_REGISTRY/stockroom-api:latest"
            fi
            {
              echo "tags<<EOF"
              echo "$TAGS"
              echo "EOF"
            } >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          annotations: ${{ steps.provenance.outputs.annotations }}

      # NOTE: Veracode Repo Tools inserts an AST scan step here that submits
      # findings to Trust Authority and records an Asset Snapshot ID.
